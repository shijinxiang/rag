# =============================================================================
# Prometheus Configuration — RAG Agent Monitoring
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: rag-agent

# Alertmanager (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

rule_files: []

scrape_configs:
  - job_name: "rag-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "celery-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-worker:8001"]
        labels:
          service: celery-worker
