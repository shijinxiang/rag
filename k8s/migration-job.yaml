apiVersion: batch/v1
kind: Job
metadata:
  name: rag-migrate
  namespace: rag
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/shijinxiang/rag-agent-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: rag-config}
            - secretRef: {name: rag-secrets}
