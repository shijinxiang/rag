apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  SECRET_KEY: replace-with-32-plus-random-characters
  JWT_SECRET_KEY: replace-with-random-jwt-secret
  OPENAI_API_KEY: replace-me
  DATABASE_URL: postgresql+asyncpg://rag_user:replace-me@postgres:5432/rag_agent
  DATABASE_URL_SYNC: postgresql://rag_user:replace-me@postgres:5432/rag_agent
  MINIO_ACCESS_KEY: replace-me
  MINIO_SECRET_KEY: replace-me
