name: CD — Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options: ["staging", "production"]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rag-agent-backend
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest

      - name: Frontend Docker meta
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rag-agent-frontend
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure target cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo 'Set KUBE_CONFIG in the selected GitHub environment'; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Migrate and deploy
        env:
          RAG_SECRETS: ${{ secrets.RAG_SECRETS_YAML }}
        run: |
          test -n "$RAG_SECRETS" || { echo 'Set RAG_SECRETS_YAML in the selected GitHub environment'; exit 1; }
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          printf '%s' "$RAG_SECRETS" | kubectl apply -f -
          kubectl delete job rag-migrate -n rag --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait -n rag --for=condition=complete job/rag-migrate --timeout=180s
          kubectl apply -k k8s
          kubectl rollout restart deployment/backend deployment/frontend deployment/celery-worker -n rag
          kubectl rollout status deployment/backend -n rag --timeout=180s
          kubectl rollout status deployment/frontend -n rag --timeout=180s
          kubectl rollout status deployment/celery-worker -n rag --timeout=180s
